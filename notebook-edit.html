<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Edit Notebook — Chinese iGCSE Vocabulary Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #EDE3D0;
      font-family: 'Inter', system-ui, sans-serif;
      color: #1E3A5F;
      -webkit-font-smoothing: antialiased;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 24px; background-color: #1E3A5F; color: #F5EFE6;
      position: sticky; top: 0; z-index: 100;
    }
    .top-bar-brand { display: flex; align-items: center; gap: 12px; }
    .top-bar-brand img { height: 32px; width: 32px; border-radius: 6px; }
    .top-bar-brand h1 { font-size: 1.1rem; font-weight: 700; margin: 0; color: #F5EFE6; }
    .student-switcher { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .student-switcher select {
      font-family: inherit; font-size: 0.85rem; padding: 4px 8px;
      border-radius: 6px; border: 1px solid rgba(245,239,230,0.3);
      background: rgba(245,239,230,0.12); color: #F5EFE6;
    }

    .main-card {
      background-color: #F5EFE6; border-radius: 12px;
      box-shadow: 0 1px 3px rgba(30,58,95,0.06), 0 4px 12px rgba(30,58,95,0.04);
      border: 1px solid rgba(30,58,95,0.08); margin: 20px;
      display: grid; grid-template-columns: 240px 240px 1fr;
      min-height: calc(100vh - 100px); overflow: hidden;
    }
    .left-panel, .middle-panel {
      border-right: 1px solid rgba(30,58,95,0.12);
      overflow-y: auto; padding: 16px 8px;
    }
    .right-panel {
      overflow-y: auto; padding: 16px 20px;
    }

    .panel-heading {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.12em; color: rgba(30,58,95,0.65);
      margin: 0 0 8px 8px;
    }

    .books-list, .pages-list { list-style: none; padding: 0; margin: 0; }
    .books-list li, .pages-list li {
      padding: 10px 12px; cursor: pointer; border-radius: 6px;
      font-size: 0.9rem; transition: background-color 0.15s;
    }
    .books-list li:hover, .pages-list li:hover { background-color: rgba(30,58,95,0.06); }
    .books-list li.selected, .pages-list li.selected {
      background-color: rgba(30,58,95,0.12); font-weight: 600;
    }
    .series-heading {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: rgba(30,58,95,0.5);
      padding: 8px 12px 4px;
    }
    .nb-badge {
      font-size: 0.8em; margin-left: 4px;
    }

    .page-card {
      background: #FAF6EE; border: 1px solid rgba(30,58,95,0.08);
      border-radius: 8px; padding: 14px; margin-bottom: 14px;
    }
    .page-card h4 {
      margin: 0 0 8px; font-size: 0.95rem; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .del-label {
      font-size: 0.8rem; color: rgba(30,58,95,0.55); white-space: nowrap;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .del-label input { margin: 0; }
    .page-card textarea {
      width: 100%; min-height: 110px; padding: 10px;
      border: 1px solid rgba(30,58,95,0.15); border-radius: 6px;
      font-family: 'Noto Sans TC','Inter',sans-serif; font-size: 0.9rem;
      color: #1E3A5F; background: #F5EFE6; resize: vertical; line-height: 1.6;
    }
    .page-card .field-hint {
      font-size: 0.75rem; color: rgba(30,58,95,0.5); margin-top: 6px;
      white-space: pre-line;
    }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 8px 16px; border-radius: 999px; font-size: 0.85rem;
      font-weight: 600; cursor: pointer; border: none;
      font-family: inherit; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #1E3A5F; color: #F5EFE6; }
    .btn-success { background: #4E9E5A; color: #fff; }
    .btn-outline { background: transparent; border: 2px solid #1E3A5F; color: #1E3A5F; }

    .back-link {
      display: inline-block; margin-top: 8px; font-size: 0.85rem;
      color: #5A9AD6; text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }

    /* Summary overlay */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 1000;
      justify-content: center; align-items: center; padding: 20px;
    }
    .overlay.active { display: flex; }
    .overlay-card {
      background: #F5EFE6; border-radius: 12px; padding: 24px;
      max-width: 560px; width: 100%; max-height: 80vh; overflow-y: auto;
      color: #1E3A5F;
    }
    .summary-item { padding: 6px 0; border-bottom: 1px solid rgba(30,58,95,0.1); font-size: 0.88rem; }
    .summary-item.add { color: #2e7d32; }
    .summary-item.remove { color: #721C24; }
    .summary-item.new-page { color: #1E3A5F; font-weight: 600; }
    .summary-item.delete-page { color: #721C24; font-weight: 600; }

    .status-badge {
      display: inline-block; font-size: 0.7rem; padding: 1px 8px;
      border-radius: 999px; margin-left: 4px; font-weight: 600;
    }
    .status-pending { background: #FEF3E4; color: #C4952A; }
    .status-generated { background: #EAF6EC; color: #4E9E5A; }
    .status-error { background: #FDECEC; color: #DB5858; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 2000;
      padding: 12px 20px; border-radius: 999px; font-size: 0.85rem;
      font-weight: 600; animation: fadeUp 0.3s;
    }
    .toast.success { background: #155724; color: #F5EFE6; }
    .toast.error { background: #721C24; color: #F5EFE6; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 900px) {
      .main-card { grid-template-columns: 1fr; }
      .left-panel, .middle-panel { border-right: none; border-bottom: 1px solid rgba(30,58,95,0.12); max-height: 200px; }
      .top-bar { flex-wrap: wrap; gap: 8px; }
      .top-bar-brand h1 { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

<!-- Top bar — identical to dashboard -->
<div class="top-bar">
  <div class="top-bar-brand">
    <img src="favicon.png" alt="" style="height:32px;width:32px;border-radius:6px;">
    <h1>Chinese iGCSE Vocabulary Trainer</h1>
  </div>
  <div class="student-switcher">
    <label for="student-switch">Student:</label>
    <select id="student-switch"><option value="">Loading...</option></select>
  </div>
</div>

<div class="main-card">
  <!-- LEFT: Books -->
  <div class="left-panel">
    <div class="panel-heading">Books</div>
    <div id="booksContainer"></div>
  </div>

  <!-- MIDDLE: Pages -->
  <div class="middle-panel">
    <div class="panel-heading">Notebook Pages</div>
    <ul class="pages-list" id="pagesList"></ul>
    <div style="margin-top:12px;">
      <button class="btn btn-outline" id="addPageBtn" style="width:100%;">+ Add Page</button>
    </div>
    <a class="back-link" id="backLink" href="#">&larr; Back to Dashboard</a>
  </div>

  <!-- RIGHT: Edit Area -->
  <div class="right-panel" id="editArea">
    <div class="panel-heading" style="margin-bottom:12px;">Edit Words</div>
    <div id="pagesEditContainer">
      <p style="color:rgba(30,58,95,0.55);">Select a page or click "Add Page" to begin.</p>
    </div>
    <div class="btn-row" id="actionRow" style="display:none;">
      <button class="btn btn-primary" id="processBtn">🔍 Process All Edits</button>
      <button class="btn btn-success" id="confirmBtn" style="display:none;">✅ Confirm &amp; Enrich</button>
      <button class="btn btn-outline" id="refreshStatusBtn">🔄 Check Processing Status</button>
    </div>
  </div>
</div>

<!-- Summary overlay -->
<div class="overlay" id="summaryOverlay">
  <div class="overlay-card">
    <h3 style="margin-top:0;">Changes Summary</h3>
    <div id="summaryContent"></div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-success" id="confirmFromSummary">✅ Confirm &amp; Enrich</button>
      <button class="btn btn-outline" id="cancelSummary">Cancel</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/student.js"></script>

<script>
(function() {
  const student = new URLSearchParams(window.location.search).get('student') || '';
  if (!student) { document.body.innerHTML = '<p style="text-align:center;padding:40px;">No student. <a href="index.html">Login</a></p>'; return; }
  document.getElementById('backLink').href = 'dashboard.html?student=' + encodeURIComponent(student);

  const storageKey = 'nb_edit_' + student;

  let notebookData = {};
  let notebookPages = {};
  let allBooks = [];

  function showToast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast ' + (type || 'success');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function getWordsForPage(pageId) {
    return Object.values(notebookData)
      .filter(e => (e.pageId || '01') === pageId)
      .map(e => e.traditional)
      .filter(Boolean);
  }

  function parseLines(text) {
    const result = [];
    const lines = text.split(/\n/);
    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed) continue;
      // Find first occurrence of either ASCII colon or full-width colon
      let colonIdx = trimmed.indexOf(':');
      if (colonIdx === -1) colonIdx = trimmed.indexOf('：');
      if (colonIdx > 0) {
        const vocab = trimmed.substring(0, colonIdx).trim();
        const ctx = trimmed.substring(colonIdx + 1).trim();
        if (/[\u4e00-\u9fff]/.test(vocab)) result.push({ vocab, context: ctx });
      } else {
        if (/[\u4e00-\u9fff]/.test(trimmed)) result.push({ vocab: trimmed, context: '' });
      }
    }
    return result;
  }

  function nextPageId() {
    const nums = [];
    for (const key of Object.keys(notebookPages)) { const n = parseInt(key,10); if (!isNaN(n)) nums.push(n); }
    return String(Math.max(0, ...nums) + 1).padStart(2, '0');
  }

  // --- Student switcher ---
  async function populateStudentDropdown() {
    const sel = document.getElementById('student-switch');
    sel.innerHTML = '';
    try {
      const names = await fetchStudentList();
      names.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name;
        if (name === student) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', () => {
        if (sel.value !== student) window.location.href = 'dashboard.html?student=' + encodeURIComponent(sel.value);
      });
    } catch(e) { sel.innerHTML = '<option>' + student + '</option>'; }
  }

  // --- Books list ---
  async function loadBooks() {
    try {
      const resp = await fetch('data/books-index.json');
      const data = await resp.json();
      allBooks = data.books || [];
    } catch(e) { allBooks = []; }
    renderBooks();
  }
  function renderBooks() {
    const container = document.getElementById('booksContainer');
    container.innerHTML = '';
    const groups = new Map();
    allBooks.forEach(b => {
      const s = b.series || 'Other';
      if (!groups.has(s)) groups.set(s, []);
      groups.get(s).push(b);
    });
    groups.forEach((books, series) => {
      books.sort((a, b) => (a.sortOrder || 99) - (b.sortOrder || 99));
      const h = document.createElement('div');
      h.className = 'series-heading'; h.textContent = series;
      container.appendChild(h);
      const ul = document.createElement('ul');
      ul.className = 'books-list';
      books.forEach(b => {
        const li = document.createElement('li');
        li.dataset.bookId = b.id;
        li.textContent = b.title;
        if (b.id === '99') {
          li.classList.add('selected');
          const badge = document.createElement('span');
          badge.className = 'nb-badge'; badge.textContent = '✏️';
          li.appendChild(badge);
        }
        li.addEventListener('click', () => {
          if (b.id === '99') {
            window.location.href = 'dashboard.html?student=' + encodeURIComponent(student) + '&book=99';
            return;
          }
          window.location.href = 'dashboard.html?student=' + encodeURIComponent(student) + '&book=' + b.id;
        });
        ul.appendChild(li);
      });
      container.appendChild(ul);
    });
  }

  // --- Pages list ---
  function renderPagesList() {
    const ul = document.getElementById('pagesList');
    ul.innerHTML = '';
    const ids = Object.keys(notebookPages).sort((a,b) => (parseInt(a,10)||99) - (parseInt(b,10)||99));
    ids.forEach(pid => {
      const page = notebookPages[pid] || {};
      const li = document.createElement('li');
      li.dataset.pageId = pid;
      li.innerHTML = (page.title || 'Page '+pid) + (pid==='01' ? ' <span style="font-size:0.75em;color:rgba(30,58,95,0.4);">(default)</span>' : '');
      li.addEventListener('click', () => scrollToPage(pid));
      ul.appendChild(li);
    });
  }

  function scrollToPage(pid) {
    const card = document.querySelector('.page-card[data-page-id="'+pid+'"]');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // --- Save drafts to sessionStorage ---
  function saveDrafts() {
    const drafts = { text: {}, checks: {}, news: [] };
    document.querySelectorAll('.page-card[data-page-id] textarea').forEach(ta => {
      drafts.text[ta.dataset.pageId] = ta.value;
    });
    document.querySelectorAll('input[type="checkbox"][data-delete-page]').forEach(cb => {
      drafts.checks[cb.dataset.deletePage] = cb.checked;
    });
    document.querySelectorAll('.page-card[data-new="true"]').forEach((card, i) => {
      const ta = card.querySelector('textarea');
      const ti = card.querySelector('input.page-title-input');
      drafts.news.push({ title: ti ? ti.value : '', text: ta ? ta.value : '' });
    });
    sessionStorage.setItem(storageKey, JSON.stringify(drafts));
  }

  function restoreDrafts() {
    try {
      const raw = sessionStorage.getItem(storageKey);
      if (!raw) return;
      const drafts = JSON.parse(raw);
      if (drafts.text) {
        Object.entries(drafts.text).forEach(([key, val]) => {
          const ta = document.querySelector('.page-card[data-page-id="'+key+'"] textarea');
          if (ta) ta.value = val;
        });
      }
      if (drafts.checks) {
        Object.entries(drafts.checks).forEach(([key, val]) => {
          const cb = document.querySelector('input[type="checkbox"][data-delete-page="'+key+'"]');
          if (cb) cb.checked = val;
        });
      }
      if (drafts.news && drafts.news.length) {
        drafts.news.forEach(n => addNewPageCard(n.title, n.text));
      }
    } catch(e) {}
  }

  // --- Render edit cards ---
  function renderEditCards() {
    const container = document.getElementById('pagesEditContainer');
    container.innerHTML = '';
    const ids = Object.keys(notebookPages).sort((a,b) => (parseInt(a,10)||99) - (parseInt(b,10)||99));

    ids.forEach(pid => {
      const page = notebookPages[pid] || {};
      const is01 = (pid === '01');

      const card = document.createElement('div');
      card.className = 'page-card';
      card.dataset.pageId = pid;
      card.id = 'page-' + pid;

      const h4 = document.createElement('h4');
      h4.textContent = 'Page ' + pid + ' — ' + (page.title || 'Page ' + pid);

      if (!is01) {
        const delLabel = document.createElement('label');
        delLabel.className = 'del-label';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.dataset.deletePage = pid;
        delLabel.appendChild(cb);
        delLabel.appendChild(document.createTextNode(' Delete page'));
        h4.appendChild(delLabel);
      }

      card.appendChild(h4);

      const ta = document.createElement('textarea');
      ta.dataset.pageId = pid;
      ta.rows = 5;
      ta.placeholder = '蘋果 : 水果\n香蕉 : 水果\n學校\n米飯 : 午餐';
      // Build display: existing words + context if known
      const lines = Object.values(notebookData)
        .filter(e => (e.pageId || '01') === pid)
        .map(e => {
          const t = e.traditional || '';
          const ctx = (e.contextSentence || '').replace(t, '').replace(/[。，,!.\s]/g, '').trim();
          return t + (ctx ? ' : ' + ctx : '');
        });
      ta.value = lines.join('\n');
      ta.dataset.original = ta.value;
      ta.addEventListener('input', () => { saveDrafts(); });

      card.appendChild(ta);

      const hint = document.createElement('div');
      hint.className = 'field-hint';
      hint.textContent = 'Enter one word per line. Add ":" or "：" followed by context.\nWords without context get AI-generated example sentences.\ne.g.\n蘋果 : 水果\n香蕉 ： 水果\n學校\n米飯 : 午餐';
      card.appendChild(hint);

      container.appendChild(card);
    });

    document.getElementById('actionRow').style.display = ids.length ? 'flex' : 'none';
    setTimeout(restoreDrafts, 50);
  }

  // --- Add page ---
  function addNewPageCard(title = '', text = '') {
    const container = document.getElementById('pagesEditContainer');

    const card = document.createElement('div');
    card.className = 'page-card';
    card.dataset.new = 'true';
    card.style.border = '2px dashed #5A9AD6';

    const h4 = document.createElement('h4');
    const ti = document.createElement('input');
    ti.type = 'text';
    ti.className = 'page-title-input';
    ti.placeholder = 'Page name (e.g. Exam Prep)';
    ti.maxLength = 50;
    ti.value = title;
    ti.style.cssText = 'font-family:inherit;font-size:0.9rem;padding:4px 8px;border:1px solid rgba(30,58,95,0.15);border-radius:4px;width:100%;max-width:280px;';

    const rmBtn = document.createElement('button');
    rmBtn.textContent = '✕ Remove';
    rmBtn.style.cssText = 'font-size:0.75rem;padding:2px 8px;border:1px solid #DB5858;border-radius:999px;background:transparent;color:#DB5858;cursor:pointer;';
    rmBtn.addEventListener('click', () => { card.remove(); saveDrafts(); });

    h4.appendChild(ti);
    h4.appendChild(rmBtn);
    card.appendChild(h4);

    const ta = document.createElement('textarea');
    ta.rows = 5;
    ta.value = text;
    ta.placeholder = '蘋果 : 水果\n香蕉 : 水果\n學校\n米飯 : 午餐';
    ta.addEventListener('input', saveDrafts);
    card.appendChild(ta);

    const hint = document.createElement('div');
    hint.className = 'field-hint';
    hint.textContent = 'Enter one word per line. Add ":" or "：" followed by context.\nWords without context get AI-generated example sentences.\ne.g.\n蘋果 : 水果\n香蕉 ： 水果\n學校\n米飯 : 午餐';
    card.appendChild(hint);

    container.appendChild(card);
    document.getElementById('actionRow').style.display = 'flex';
    card.scrollIntoView({ behavior: 'smooth' });
    if (!title) ti.focus();
    saveDrafts();
  }

  document.getElementById('addPageBtn').addEventListener('click', () => addNewPageCard());

  // --- Process diff ---
  function computeDiff() {
    const diffs = [];
    Object.keys(notebookPages).forEach(pid => {
      const page = notebookPages[pid] || {};
      const currentWords = getWordsForPage(pid);
      const ta = document.querySelector('.page-card[data-page-id="'+pid+'"] textarea');
      if (!ta) return;
      const desired = parseLines(ta.value);
      const desiredVocabs = desired.map(d => d.vocab);
      const added = desiredVocabs.filter(v => !currentWords.includes(v));
      const removed = currentWords.filter(v => !desiredVocabs.includes(v));
      if (added.length || removed.length) {
        diffs.push({ pageId: pid, title: page.title || ('Page '+pid), added, removed, contexts: desired, isNew: false, isDelete: false });
      }
    });
    document.querySelectorAll('input[type="checkbox"][data-delete-page]:checked').forEach(cb => {
      const pid = cb.dataset.deletePage;
      const page = notebookPages[pid] || {};
      diffs.push({ pageId: pid, title: page.title || ('Page '+pid), added: [], removed: getWordsForPage(pid), contexts: [], isNew: false, isDelete: true });
    });
    document.querySelectorAll('.page-card[data-new="true"]').forEach(card => {
      const ti = card.querySelector('input.page-title-input');
      const ta = card.querySelector('textarea');
      const title = ti ? ti.value.trim() : '';
      const desired = ta ? parseLines(ta.value) : [];
      if (title) {
        diffs.push({ pageId: null, title, added: desired.map(d=>d.vocab), removed: [], contexts: desired, isNew: true, isDelete: false });
      }
    });
    return diffs;
  }

  function showSummary(diffs) {
    const content = document.getElementById('summaryContent');
    content.innerHTML = '';
    if (!diffs.length) { content.innerHTML = '<p>No changes detected.</p>'; }
    diffs.forEach(d => {
      const div = document.createElement('div');
      div.className = 'summary-item';
      if (d.isDelete) { div.classList.add('delete-page'); div.textContent = '🗑 DELETE Page "'+d.title+'" ('+d.removed.length+' words removed)'; }
      else if (d.isNew) { div.classList.add('new-page'); div.textContent = '➕ NEW Page "'+d.title+'": ' + (d.added.length ? d.added.join(', ') : '(empty)'); }
      else {
        const parts = [];
        if (d.added.length) parts.push('➕ Add: '+d.added.join(', '));
        if (d.removed.length) parts.push('➖ Remove: '+d.removed.join(', '));
        div.textContent = '📄 Page "'+d.title+'": ' + parts.join(' | ');
        if (d.added.length) div.classList.add('add');
        if (d.removed.length) div.classList.add('remove');
      }
      content.appendChild(div);
    });
    document.getElementById('summaryOverlay').classList.add('active');
    document.getElementById('confirmFromSummary').style.display = diffs.length ? '' : 'none';
  }

  document.getElementById('processBtn').addEventListener('click', () => {
    const diffs = computeDiff();
    showSummary(diffs);
  });
  document.getElementById('cancelSummary').addEventListener('click', () => {
    document.getElementById('summaryOverlay').classList.remove('active');
  });

  // --- Execute ---
  async function executeChanges(diffs) {
    if (!diffs.length) return;
    const docRef = db.collection('students').doc(student);
    const doc = await docRef.get();
    const data = doc.exists ? doc.data() : {};
    const notebook = data.notebook || {};
    const pages = data.notebookPages || {};
    if (!pages['01']) pages['01'] = { title: 'Main page' };

    // Track dispatch info: { pageId: [words] }
    const dispatches = {};

    for (const d of diffs) {
      if (d.isDelete) {
        delete pages[d.pageId];
        for (const wid of Object.keys(notebook)) {
          if (notebook[wid].pageId === d.pageId) delete notebook[wid];
        }
      } else if (d.isNew) {
        const newId = nextPageId();
        pages[newId] = { title: d.title };
        if (d.added.length) dispatches[newId] = d.added;
        for (const item of d.contexts) {
          const wid = notebookWordId(student, item.vocab);
          notebook[wid] = {
            traditional: item.vocab, simplified: '', english: '', pinyin: '',
            contextSentence: item.context || '', contextSentenceSimplified: '',
            audio: {}, pageId: newId, source: 'notebook',
            status: 'pending', failCount: 0,
            savedAt: firebase.firestore.FieldValue.serverTimestamp(),
          };
        }
      } else {
        if (d.added.length) dispatches[d.pageId] = d.added;
        for (const word of d.removed) {
          const wid = notebookWordId(student, word);
          delete notebook[wid];
        }
        for (const item of d.contexts) {
          if (!d.added.includes(item.vocab)) continue;
          const wid = notebookWordId(student, item.vocab);
          const existing = notebook[wid] || {};
          notebook[wid] = {
            traditional: item.vocab, simplified: existing.simplified || '', english: existing.english || '',
            pinyin: existing.pinyin || '', contextSentence: item.context || existing.contextSentence || '',
            contextSentenceSimplified: item.context ? '' : (existing.contextSentenceSimplified || ''),
            audio: existing.audio || {}, pageId: d.pageId,
            source: existing.source || 'notebook', status: 'pending',
            failCount: existing.failCount || 0,
            savedAt: firebase.firestore.FieldValue.serverTimestamp(),
          };
        }
      }
    }

    data.notebook = notebook;
    data.notebookPages = pages;
    data.lastUpdated = firebase.firestore.FieldValue.serverTimestamp();
    await docRef.set(data);

    // Create dispatch docs for each page with new words (non-blocking)
    for (const [pid, words] of Object.entries(dispatches)) {
      dispatchNotebookPage(student, pid, words, '');
    }

    notebookData = notebook;
    notebookPages = pages;
    sessionStorage.removeItem(storageKey);
  }

  async function doConfirm() {
    const diffs = computeDiff();
    if (!diffs.length) { showToast('No changes to process', 'error'); return; }
    try {
      await executeChanges(diffs);
      document.getElementById('summaryOverlay').classList.remove('active');
      const pendingCount = diffs.reduce((sum, d) => sum + d.added.length, 0);
      showToast('Saved ' + pendingCount + ' word(s)! Enrichment will begin — refresh status in ~2 min.', 'success');
      renderEditCards();
      renderPagesList();
    } catch(err) {
      console.error(err);
      showToast('Failed to save. Please try again.', 'error');
    }
  }

  document.getElementById('confirmBtn').addEventListener('click', doConfirm);
  document.getElementById('confirmFromSummary').addEventListener('click', doConfirm);

  // --- Refresh status ---
  async function refreshStatus() {
    try {
      notebookData = await loadNotebook(student);
      renderEditCards();
      renderPagesList();
      const counts = { pending: 0, generated: 0, error: 0 };
      Object.values(notebookData).forEach(e => {
        if (e.status === 'pending') counts.pending++;
        else if (e.status === 'generated') counts.generated++;
        else if (e.status === 'error') counts.error++;
      });
      let msg = 'Status checked. ';
      if (counts.pending) msg += '⏳ ' + counts.pending + ' pending. ';
      if (counts.generated) msg += '✅ ' + counts.generated + ' generated. ';
      if (counts.error) msg += '❌ ' + counts.error + ' failed. ';
      if (!counts.pending && !counts.error) msg += 'All complete!';
      showToast(msg.trim(), counts.error ? 'error' : 'success');
    } catch(e) { showToast('Refresh failed', 'error'); }
  }
  document.getElementById('refreshStatusBtn').addEventListener('click', refreshStatus);

  // --- Init ---
  async function init() {
    await populateStudentDropdown();
    await loadBooks();
    try {
      notebookData = await loadNotebook(student);
      notebookPages = await loadNotebookPages(student);
    } catch(e) { console.error(e); }
    renderPagesList();
    renderEditCards();
  }
  init();
})();
</script>
</body>
</html>
