<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit My Notebook — GCSE Chinese</title>
    <style>
        :root {
            --primary: #4a90d9;
            --danger: #d94a4a;
            --success: #4ad97a;
            --warning: #d9c04a;
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #2c3e50;
            --border: #dee2e6;
            --radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 16px;
            max-width: 900px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .top-bar h1 { font-size: 1.4em; }
        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.95em;
        }
        .back-link:hover { text-decoration: underline; }

        .page-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
        }
        .page-card h3 {
            font-size: 1.1em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .page-card h3 input[type="text"] {
            font-size: 1em;
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            width: 100%;
            max-width: 300px;
        }
        .page-card .delete-check {
            font-size: 0.85em;
            color: var(--danger);
            white-space: nowrap;
        }
        .page-card textarea {
            width: 100%;
            min-height: 80px;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.95em;
            font-family: inherit;
            resize: vertical;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .context-area {
            margin-bottom: 16px;
        }
        .context-area label {
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }
        .context-area textarea {
            width: 100%;
            min-height: 60px;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.95em;
            font-family: inherit;
            resize: vertical;
        }

        .summary-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .summary-overlay.active { display: flex; }
        .summary-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .summary-card h2 { margin-bottom: 12px; }
        .summary-item {
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9em;
        }
        .summary-item.add { color: #2e7d32; }
        .summary-item.remove { color: var(--danger); }
        .summary-item.new-page { color: var(--primary); font-weight: 600; }
        .summary-item.delete-page { color: var(--danger); font-weight: 600; }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--text);
            color: #fff;
            padding: 12px 20px;
            border-radius: var(--radius);
            font-size: 0.9em;
            z-index: 2000;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .status-badge {
            display: inline-block;
            font-size: 0.8em;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 6px;
        }
        .status-pending { background: var(--warning); color: #5c4700; }
        .status-generated { background: var(--success); color: #1a4d2a; }
        .status-error { background: var(--danger); color: #fff; }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .top-bar h1 { font-size: 1.1em; }
            .btn { width: 100%; margin-bottom: 8px; text-align: center; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <h1>✏️ Edit My Notebook</h1>
    <a class="back-link" id="backLink" href="#">← Back to Dashboard</a>
</div>

<div id="pagesContainer"></div>

<div style="margin-bottom:16px;">
    <button class="btn btn-outline" id="addPageBtn">➕ Add Page</button>
</div>

<div class="context-area">
    <label for="contextInput">📝 Context / Theme (optional — helps AI generate better example sentences):</label>
    <textarea id="contextInput" placeholder="e.g. 食物, 旅行, 學校生活..."></textarea>
</div>

<div style="display:flex; gap:8px; flex-wrap:wrap;">
    <button class="btn btn-primary" id="processBtn">🔍 Process All Edits</button>
    <button class="btn btn-success" id="confirmBtn" style="display:none;">✅ Confirm &amp; Enrich</button>
</div>

<!-- Summary overlay -->
<div class="summary-overlay" id="summaryOverlay">
    <div class="summary-card">
        <h2>Changes Summary</h2>
        <div id="summaryContent"></div>
        <div style="margin-top:16px; display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-success" id="confirmFromSummary">✅ Confirm &amp; Enrich</button>
            <button class="btn btn-outline" id="cancelSummary">Cancel</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/student.js"></script>

<script>
(function() {
    // --- State ---
    const student = new URLSearchParams(window.location.search).get('student') || '';

    if (!student) {
        document.body.innerHTML = '<p style="text-align:center;padding:40px;">No student specified. <a href="index.html">Go to login</a></p>';
        return;
    }

    document.getElementById('backLink').href = 'dashboard.html?student=' + encodeURIComponent(student);

    let notebookData = {};
    let notebookPages = {};
    let context = '';

    // --- Helpers ---
    function showToast(msg) {
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }

    function getWordsForPage(pageId) {
        return Object.values(notebookData)
            .filter(e => (e.pageId || '01') === pageId)
            .map(e => e.traditional)
            .filter(Boolean);
    }

    function parseWords(text) {
        return text.split(/[,，、\s]+/)
            .map(w => w.trim())
            .filter(w => w.length > 0)
            .filter(w => /[\u4e00-\u9fff]/.test(w));  // must contain Chinese
    }

    function nextPageId() {
        const nums = [];
        for (const key of Object.keys(notebookPages)) {
            const n = parseInt(key, 10);
            if (!isNaN(n)) nums.push(n);
        }
        return String(Math.max(0, ...nums) + 1).padStart(2, '0');
    }

    // --- Render ---
    function render() {
        const container = document.getElementById('pagesContainer');
        container.innerHTML = '';

        const sortedIds = Object.keys(notebookPages).sort((a, b) => {
            const na = parseInt(a, 10), nb = parseInt(b, 10);
            if (!isNaN(na) && !isNaN(nb)) return na - nb;
            return a.localeCompare(b);
        });

        sortedIds.forEach(pageId => {
            const page = notebookPages[pageId] || { title: 'Page ' + pageId };
            const currentWords = getWordsForPage(pageId);
            const isPage01 = (pageId === '01');

            const card = document.createElement('div');
            card.className = 'page-card';
            card.dataset.pageId = pageId;

            // Title row
            const h3 = document.createElement('h3');
            if (isPage01) {
                h3.textContent = page.title || 'Main page';
            } else {
                const titleInput = document.createElement('input');
                titleInput.type = 'text';
                titleInput.value = page.title || ('Page ' + pageId);
                titleInput.maxLength = 50;
                titleInput.placeholder = 'Page name';
                titleInput.addEventListener('input', () => {
                    notebookPages[pageId] = notebookPages[pageId] || {};
                    notebookPages[pageId].title = titleInput.value || ('Page ' + pageId);
                });
                h3.appendChild(titleInput);
            }

            // Delete checkbox (not for 01)
            if (!isPage01) {
                const delLabel = document.createElement('label');
                delLabel.className = 'delete-check';
                const delCheck = document.createElement('input');
                delCheck.type = 'checkbox';
                delCheck.dataset.deletePage = pageId;
                delLabel.appendChild(delCheck);
                delLabel.appendChild(document.createTextNode(' Delete this page'));
                h3.appendChild(delLabel);
            }

            card.appendChild(h3);

            // Words textarea
            const textarea = document.createElement('textarea');
            textarea.value = currentWords.join(', ');
            textarea.placeholder = 'Enter words separated by commas (e.g. 蘋果, 香蕉, 米飯)';
            textarea.rows = 3;
            card.appendChild(textarea);

            container.appendChild(card);
        });
    }

    // --- Process ---
    function computeDiff() {
        const diffs = [];

        Object.keys(notebookPages).forEach(pageId => {
            const page = notebookPages[pageId] || {};
            const currentWords = getWordsForPage(pageId);
            const textarea = document.querySelector(`.page-card[data-page-id="${pageId}"] textarea`);
            const desiredWords = textarea ? parseWords(textarea.value) : [];
            const added = desiredWords.filter(w => !currentWords.includes(w));
            const removed = currentWords.filter(w => !desiredWords.includes(w));

            if (added.length || removed.length) {
                diffs.push({
                    pageId,
                    title: page.title || ('Page ' + pageId),
                    added,
                    removed,
                });
            }
        });

        // Check for new pages (added via button)
        const newPageSections = document.querySelectorAll('.page-card[data-new="true"]');
        newPageSections.forEach(card => {
            const titleInput = card.querySelector('h3 input[type="text"]');
            const textarea = card.querySelector('textarea');
            const title = titleInput ? titleInput.value : '';
            const words = textarea ? parseWords(textarea.value) : [];
            if (title && words.length) {
                diffs.push({
                    pageId: null,  // will assign on confirm
                    title,
                    added: words,
                    removed: [],
                    isNew: true,
                });
            }
        });

        // Check for deleted pages
        const deleteChecks = document.querySelectorAll('input[type="checkbox"][data-delete-page]');
        deleteChecks.forEach(check => {
            if (check.checked) {
                const pageId = check.dataset.deletePage;
                const page = notebookPages[pageId] || {};
                diffs.push({
                    pageId,
                    title: page.title || ('Page ' + pageId),
                    added: [],
                    removed: getWordsForPage(pageId),
                    isDelete: true,
                });
            }
        });

        return diffs;
    }

    function showSummary(diffs) {
        const content = document.getElementById('summaryContent');
        content.innerHTML = '';

        if (diffs.length === 0) {
            content.innerHTML = '<p>No changes detected.</p>';
        }

        diffs.forEach(d => {
            const div = document.createElement('div');
            div.className = 'summary-item';

            if (d.isDelete) {
                div.classList.add('delete-page');
                div.textContent = `🗑 DELETE Page "${d.title}" (${d.removed.length} words will be removed)`;
            } else if (d.isNew) {
                div.classList.add('new-page');
                div.textContent = `➕ NEW Page "${d.title}": add ${d.added.join(', ')}`;
            } else {
                const parts = [];
                if (d.added.length) parts.push(`➕ Add: ${d.added.join(', ')}`);
                if (d.removed.length) parts.push(`➖ Remove: ${d.removed.join(', ')}`);
                div.textContent = `📄 Page "${d.title}": ${parts.join(' | ')}`;
                if (d.added.length) div.classList.add('add');
                if (d.removed.length) div.classList.add('remove');
            }

            content.appendChild(div);
        });

        document.getElementById('summaryOverlay').classList.add('active');
        document.getElementById('confirmFromSummary').style.display = diffs.length ? '' : 'none';
    }

    async function executeChanges(diffs) {
        if (!diffs.length) return;

        // Read current full document
        const docRef = db.collection('students').doc(student);
        const doc = await docRef.get();
        const data = doc.exists ? doc.data() : {};
        const notebook = data.notebook || {};
        const pages = data.notebookPages || {};
        if (!pages['01']) pages['01'] = { title: NOTEBOOK_DEFAULT_PAGE_TITLE || 'Main page' };

        context = document.getElementById('contextInput').value.trim();

        for (const d of diffs) {
            if (d.isDelete) {
                // Remove page and its words
                delete pages[d.pageId];
                for (const wid of Object.keys(notebook)) {
                    if (notebook[wid].pageId === d.pageId) {
                        delete notebook[wid];
                    }
                }
            } else if (d.isNew) {
                // Assign new page ID
                const newId = nextPageId();
                pages[newId] = { title: d.title };
                for (const word of d.added) {
                    const wordId = notebookWordId(student, word);
                    notebook[wordId] = {
                        traditional: word,
                        simplified: '',
                        english: '',
                        pinyin: '',
                        contextSentence: '',
                        contextSentenceSimplified: '',
                        audio: {},
                        pageId: newId,
                        source: 'notebook',
                        status: 'pending',
                        failCount: 0,
                        savedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    };
                }
            } else {
                // Existing page: add/remove words
                const pageId = d.pageId;
                // Remove words
                for (const word of d.removed) {
                    const wid = notebookWordId(student, word);
                    delete notebook[wid];
                }
                // Add words
                for (const word of d.added) {
                    const wid = notebookWordId(student, word);
                    const existing = notebook[wid] || {};
                    notebook[wid] = {
                        traditional: word,
                        simplified: existing.simplified || '',
                        english: existing.english || '',
                        pinyin: existing.pinyin || '',
                        contextSentence: existing.contextSentence || '',
                        contextSentenceSimplified: existing.contextSentenceSimplified || '',
                        audio: existing.audio || {},
                        pageId: pageId,
                        source: existing.source || 'notebook',
                        status: 'pending',
                        failCount: existing.failCount || 0,
                        savedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    };
                }
            }
        }

        // Write back (nested map)
        data.notebook = notebook;
        data.notebookPages = pages;
        if (context) data._notebook_context = context;
        data.lastUpdated = firebase.firestore.FieldValue.serverTimestamp();
        await docRef.set(data);

        // Reload local state
        notebookData = notebook;
        notebookPages = pages;
    }

    // --- Add page ---
    document.getElementById('addPageBtn').addEventListener('click', () => {
        const container = document.getElementById('pagesContainer');
        const card = document.createElement('div');
        card.className = 'page-card';
        card.dataset.new = 'true';

        const h3 = document.createElement('h3');
        const titleInput = document.createElement('input');
        titleInput.type = 'text';
        titleInput.placeholder = 'New page name (e.g. Exam Prep)';
        titleInput.maxLength = 50;
        titleInput.style.cssText = 'font-size:1em;padding:4px 8px;border:1px solid var(--border);border-radius:4px;width:100%;max-width:300px;';
        h3.appendChild(titleInput);
        card.appendChild(h3);

        const textarea = document.createElement('textarea');
        textarea.placeholder = 'Enter words for this page (e.g. 機場, 火車)';
        textarea.rows = 3;
        card.appendChild(textarea);

        container.appendChild(card);
        card.scrollIntoView({ behavior: 'smooth' });
    });

    // --- Process ---
    document.getElementById('processBtn').addEventListener('click', () => {
        const diffs = computeDiff();
        showSummary(diffs);
    });

    document.getElementById('cancelSummary').addEventListener('click', () => {
        document.getElementById('summaryOverlay').classList.remove('active');
    });

    // --- Confirm ---
    async function doConfirm() {
        const diffs = computeDiff();
        if (!diffs.length) {
            showToast('No changes to process');
            return;
        }

        document.getElementById('confirmBtn').disabled = true;

        try {
            await executeChanges(diffs);
            document.getElementById('summaryOverlay').classList.remove('active');
            showToast('Changes saved! Enrichment will begin shortly. Check back for ⏳→✅ status.');
            render();
        } catch (err) {
            console.error('Failed to save changes:', err);
            showToast('Failed to save changes. Please try again.');
        } finally {
            document.getElementById('confirmBtn').disabled = false;
        }
    }

    document.getElementById('confirmBtn').addEventListener('click', doConfirm);
    document.getElementById('confirmFromSummary').addEventListener('click', doConfirm);

    // --- Init ---
    async function init() {
        try {
            notebookData = await loadNotebook(student);
            notebookPages = await loadNotebookPages(student);

            // Read existing context if any
            const doc = await db.collection('students').doc(student).get();
            if (doc.exists) {
                context = doc.data()._notebook_context || '';
                document.getElementById('contextInput').value = context;
            }
        } catch (err) {
            console.error('Failed to load notebook:', err);
            showToast('Failed to load notebook data');
        }
        render();
    }

    init();
})();
</script>

</body>
</html>
