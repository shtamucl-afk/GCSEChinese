<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Edit Notebook — Chinese iGCSE Vocabulary Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #EDE3D0;
      font-family: 'Inter', system-ui, sans-serif;
      color: #1E3A5F;
      -webkit-font-smoothing: antialiased;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 24px; background-color: #1E3A5F; color: #F5EFE6;
      position: sticky; top: 0; z-index: 100;
    }
    .top-bar-brand { display: flex; align-items: center; gap: 12px; }
    .top-bar-brand img { height: 32px; width: 32px; border-radius: 6px; }
    .top-bar-brand h1 { font-size: 1.1rem; font-weight: 700; margin: 0; color: #F5EFE6; }
    .student-switcher { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .student-switcher select {
      font-family: inherit; font-size: 0.85rem; padding: 4px 8px;
      border-radius: 6px; border: 1px solid rgba(245,239,230,0.3);
      background: rgba(245,239,230,0.12); color: #F5EFE6;
    }

    .main-card {
      background-color: #F5EFE6; border-radius: 12px;
      box-shadow: 0 1px 3px rgba(30,58,95,0.06), 0 4px 12px rgba(30,58,95,0.04);
      border: 1px solid rgba(30,58,95,0.08); margin: 20px;
      display: grid; grid-template-columns: 80px 220px 1fr;
      min-height: calc(100vh - 100px); overflow: hidden;
    }
    .left-panel, .middle-panel {
      border-right: 1px solid rgba(30,58,95,0.12);
      overflow-y: auto; padding: 16px 8px;
    }
    .right-panel {
      overflow-y: auto; padding: 16px 20px;
    }

    .panel-heading {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.12em; color: rgba(30,58,95,0.65);
      margin: 0 0 8px 8px;
    }

    .books-list, .pages-list { list-style: none; padding: 0; margin: 0; }
    .books-list li, .pages-list li {
      padding: 10px 12px; cursor: pointer; border-radius: 6px;
      font-size: 0.9rem; transition: background-color 0.15s;
    }
    .books-list li:hover, .pages-list li:hover { background-color: rgba(30,58,95,0.06); }
    .books-list li.selected, .pages-list li.selected {
      background-color: rgba(30,58,95,0.12); font-weight: 600;
    }
    .series-heading {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: rgba(30,58,95,0.5);
      padding: 8px 12px 4px;
    }
    .nb-badge {
      font-size: 0.8em; margin-left: 4px;
    }

    .page-card {
      background: #FAF6EE; border: 1px solid rgba(30,58,95,0.08);
      border-radius: 8px; padding: 14px; margin-bottom: 14px;
    }
    .page-card h4 {
      margin: 0 0 8px; font-size: 0.95rem; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .del-label {
      font-size: 0.8rem; color: rgba(30,58,95,0.55); white-space: nowrap;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .del-label input { margin: 0; }
    .page-card textarea {
      width: 100%; min-height: 110px; padding: 10px;
      border: 1px solid rgba(30,58,95,0.15); border-radius: 6px;
      font-family: 'Noto Sans TC','Inter',sans-serif; font-size: 0.9rem;
      color: #1E3A5F; background: #F5EFE6; resize: vertical; line-height: 1.6;
    }
    .page-card .field-hint {
      font-size: 0.75rem; color: rgba(30,58,95,0.5); margin-top: 6px;
      white-space: pre-line;
    }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 8px 16px; border-radius: 999px; font-size: 0.85rem;
      font-weight: 600; cursor: pointer; border: none;
      font-family: inherit; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #1E3A5F; color: #F5EFE6; }
    .btn-success { background: #4E9E5A; color: #fff; }
    .btn-outline { background: transparent; border: 2px solid #1E3A5F; color: #1E3A5F; }

    .back-link {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 12px 0; font-size: 0.75rem; font-weight: 500;
      color: #5A9AD6; text-decoration: none; text-align: center;
      border-radius: 8px; transition: background-color 0.15s;
    }
    .back-link:hover { background-color: rgba(90,154,214,0.1); text-decoration: underline; }
    .back-link-icon { font-size: 1.3rem; }
    
    .mode-subtitle {
      text-align: center; font-size: 18px; font-weight: 600;
      color: #F5EFE6; padding: 6px 24px;
      letter-spacing: -0.01em;
      background: #C4952A;
    }

    /* Summary overlay */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 1000;
      justify-content: center; align-items: center; padding: 20px;
    }
    .overlay.active { display: flex; }
    .overlay-card {
      background: #F5EFE6; border-radius: 12px; padding: 24px;
      max-width: 560px; width: 100%; max-height: 80vh; overflow-y: auto;
      color: #1E3A5F;
    }
    .summary-item { padding: 6px 0; border-bottom: 1px solid rgba(30,58,95,0.1); font-size: 0.88rem; }
    .summary-item.add { color: #2e7d32; }
    .summary-item.remove { color: #721C24; }
    .summary-item.new-page { color: #1E3A5F; font-weight: 600; }
    .summary-item.delete-page { color: #721C24; font-weight: 600; }

    .status-badge {
      display: inline-block; font-size: 0.7rem; padding: 1px 8px;
      border-radius: 999px; margin-left: 4px; font-weight: 600;
    }
    .status-pending { background: #FEF3E4; color: #C4952A; }
    .status-generated { background: #EAF6EC; color: #4E9E5A; }
    .status-error { background: #FDECEC; color: #DB5858; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 2000;
      padding: 12px 20px; border-radius: 999px; font-size: 0.85rem;
      font-weight: 600; animation: fadeUp 0.3s;
    }
    .toast.success { background: #155724; color: #F5EFE6; }
    .toast.error { background: #721C24; color: #F5EFE6; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 900px) {
      .main-card { grid-template-columns: 1fr; }
      .left-panel, .middle-panel { border-right: none; border-bottom: 1px solid rgba(30,58,95,0.12); max-height: 200px; }
      .top-bar { flex-wrap: wrap; gap: 8px; }
      .top-bar-brand h1 { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

<!-- Top bar — identical to dashboard -->
<div class="top-bar">
  <div class="top-bar-brand">
    <img src="favicon.png" alt="" style="height:32px;width:32px;border-radius:6px;">
    <h1>Chinese iGCSE Vocabulary Trainer</h1>
  </div>
  <div class="student-switcher">
    <label for="student-switch">Student:</label>
    <select id="student-switch"><option value="">Loading...</option></select>
  </div>
</div>

<div class="mode-subtitle">📓 Notebook Edit Mode</div>

<div class="main-card">
  <!-- LEFT: Back to Dashboard -->
  <div class="left-panel">
    <a class="back-link" id="backLink" href="#">
      <span class="back-link-icon">↩</span>
      Dashboard
    </a>
  </div>

  <!-- MIDDLE: Pages -->
  <div class="middle-panel">
    <div class="panel-heading">Notebook Pages</div>
    <ul class="pages-list" id="pagesList"></ul>
    <div style="margin-top:12px;">
      <button class="btn btn-outline" id="addPageBtn" style="width:100%;">+ Add Page</button>
    </div>
  </div>

  <!-- RIGHT: Edit Area -->
  <div class="right-panel" id="editArea">
    <div class="panel-heading" style="margin-bottom:12px;">Edit Words</div>
    <div id="pagesEditContainer">
      <p style="color:rgba(30,58,95,0.55);">Select a page or click "Add Page" to begin.</p>
    </div>
    <div class="btn-row" id="actionRow" style="display:none;">
      <button class="btn btn-primary" id="processBtn">🔍 Process All Edits</button>
      <button class="btn btn-success" id="confirmBtn" style="display:none;">✅ Confirm &amp; Enrich</button>
      <button class="btn btn-outline" id="refreshStatusBtn">🔄 Check Processing Status</button>
    </div>
  </div>
</div>

<!-- Summary overlay -->
<div class="overlay" id="summaryOverlay">
  <div class="overlay-card">
    <h3 style="margin-top:0;">Changes Summary</h3>
    <div id="summaryContent"></div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-success" id="confirmFromSummary">✅ Confirm &amp; Enrich</button>
      <button class="btn btn-outline" id="cancelSummary">Cancel</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/student.js"></script>

<script>
(function() {
  const student = new URLSearchParams(window.location.search).get('student') || '';
  if (!student) { document.body.innerHTML = '<p style="text-align:center;padding:40px;">No student. <a href="index.html">Login</a></p>'; return; }
  document.getElementById('backLink').href = 'dashboard.html?student=' + encodeURIComponent(student);

  const storageKey = 'nb_edit_' + student;

  let notebookData = {};
  let notebookPages = {};
  let allBooks = [];

  function showToast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast ' + (type || 'success');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 7000);
  }

  function getWordsForPage(pageId) {
    return Object.values(notebookData)
      .filter(e => (e.pageId || '01') === pageId)
      .map(e => e.traditional)
      .filter(Boolean);
  }

  function parseWords(text) {
    return text.split(/[,，、\n]/).map(w => w.trim()).filter(w => w && /[\u4e00-\u9fff]/.test(w));
  }

  function nextPageId() {
    const nums = [];
    for (const key of Object.keys(notebookPages)) { const n = parseInt(key,10); if (!isNaN(n)) nums.push(n); }
    return String(Math.max(0, ...nums) + 1).padStart(2, '0');
  }

  // --- Student switcher ---
  async function populateStudentDropdown() {
    const sel = document.getElementById('student-switch');
    sel.innerHTML = '';
    try {
      const names = await fetchStudentList();
      names.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name;
        if (name === student) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', () => {
        if (sel.value !== student) window.location.href = 'dashboard.html?student=' + encodeURIComponent(sel.value);
      });
    } catch(e) { sel.innerHTML = '<option>' + student + '</option>'; }
  }

  // --- Books list ---
  async function loadBooks() {
    try {
      const resp = await fetch('data/books-index.json');
      const data = await resp.json();
      allBooks = data.books || [];
    } catch(e) { allBooks = []; }
    renderBooks();
  }
  function renderBooks() {
    const container = document.getElementById('booksContainer');
    container.innerHTML = '';
    const groups = new Map();
    allBooks.forEach(b => {
      const s = b.series || 'Other';
      if (!groups.has(s)) groups.set(s, []);
      groups.get(s).push(b);
    });
    groups.forEach((books, series) => {
      books.sort((a, b) => (a.sortOrder || 99) - (b.sortOrder || 99));
      const h = document.createElement('div');
      h.className = 'series-heading'; h.textContent = series;
      container.appendChild(h);
      const ul = document.createElement('ul');
      ul.className = 'books-list';
      books.forEach(b => {
        const li = document.createElement('li');
        li.dataset.bookId = b.id;
        li.textContent = b.title;
        if (b.id === '99') {
          li.classList.add('selected');
          const badge = document.createElement('span');
          badge.className = 'nb-badge'; badge.textContent = '✏️';
          li.appendChild(badge);
        }
        li.addEventListener('click', () => {
          if (b.id === '99') {
            window.location.href = 'dashboard.html?student=' + encodeURIComponent(student) + '&book=99';
            return;
          }
          window.location.href = 'dashboard.html?student=' + encodeURIComponent(student) + '&book=' + b.id;
        });
        ul.appendChild(li);
      });
      container.appendChild(ul);
    });
  }

  // --- Pages list ---
  function renderPagesList() {
    const ul = document.getElementById('pagesList');
    ul.innerHTML = '';
    const ids = Object.keys(notebookPages).sort((a,b) => (parseInt(a,10)||99) - (parseInt(b,10)||99));
    ids.forEach(pid => {
      const page = notebookPages[pid] || {};
      const li = document.createElement('li');
      li.dataset.pageId = pid;
      li.innerHTML = (page.title || 'Page '+pid) + (pid==='01' ? ' <span style="font-size:0.75em;color:rgba(30,58,95,0.4);">(default)</span>' : '');
      li.addEventListener('click', () => scrollToPage(pid));
      ul.appendChild(li);
    });
  }

  function scrollToPage(pid) {
    const card = document.querySelector('.page-card[data-page-id="'+pid+'"]');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // --- Save drafts to sessionStorage ---
  function saveDrafts() {
    const drafts = { text: {}, contexts: {}, checks: {}, news: [] };
    document.querySelectorAll('.page-card[data-page-id] textarea').forEach(ta => {
      if (ta.classList.contains('page-context-ta')) {
        drafts.contexts[ta.dataset.pageId] = ta.value;
      } else {
        drafts.text[ta.dataset.pageId] = ta.value;
      }
    });
    document.querySelectorAll('input[type="checkbox"][data-delete-page]').forEach(cb => {
      drafts.checks[cb.dataset.deletePage] = cb.checked;
    });
    document.querySelectorAll('.page-card[data-new="true"]').forEach((card, i) => {
      const ta = card.querySelector('textarea');
      const ti = card.querySelector('input.page-title-input');
      drafts.news.push({ title: ti ? ti.value : '', text: ta ? ta.value : '' });
    });
    sessionStorage.setItem(storageKey, JSON.stringify(drafts));
  }

  function restoreDrafts() {
    try {
      const raw = sessionStorage.getItem(storageKey);
      if (!raw) return;
      const drafts = JSON.parse(raw);
      if (drafts.text) {
        Object.entries(drafts.text).forEach(([key, val]) => {
          const ta = document.querySelector('.page-card[data-page-id="'+key+'"] textarea:not(.page-context-ta)');
          if (ta) ta.value = val;
        });
      }
      if (drafts.contexts) {
        Object.entries(drafts.contexts).forEach(([key, val]) => {
          const ta = document.querySelector('.page-context-ta[data-page-id="'+key+'"]');
          if (ta) ta.value = val;
        });
      }
      if (drafts.checks) {
        Object.entries(drafts.checks).forEach(([key, val]) => {
          const cb = document.querySelector('input[type="checkbox"][data-delete-page="'+key+'"]');
          if (cb) cb.checked = val;
        });
      }
      if (drafts.news && drafts.news.length) {
        drafts.news.forEach(n => addNewPageCard(n.title, n.text));
      }
    } catch(e) {}
  }

  // --- Render edit cards ---
  function renderEditCards() {
    const container = document.getElementById('pagesEditContainer');
    container.innerHTML = '';
    const ids = Object.keys(notebookPages).sort((a,b) => (parseInt(a,10)||99) - (parseInt(b,10)||99));

    ids.forEach(pid => {
      const page = notebookPages[pid] || {};
      const is01 = (pid === '01');

      const card = document.createElement('div');
      card.className = 'page-card';
      card.dataset.pageId = pid;
      card.id = 'page-' + pid;

      const h4 = document.createElement('h4');
      h4.textContent = page.title || ('Page ' + pid);

      if (!is01) {
        const delLabel = document.createElement('label');
        delLabel.className = 'del-label';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.dataset.deletePage = pid;
        delLabel.appendChild(cb);
        delLabel.appendChild(document.createTextNode(' Delete page'));
        h4.appendChild(delLabel);
      }

      card.appendChild(h4);

      const ta = document.createElement('textarea');
      ta.dataset.pageId = pid;
      ta.rows = 3;
      ta.placeholder = '蘋果, 香蕉, 學校, 米飯\n（只接受繁體中文，逗號分隔）';
      // Build display: existing words as comma-separated list
      const existingWords = Object.values(notebookData)
        .filter(e => (e.pageId || '01') === pid)
        .map(e => e.traditional || '')
        .filter(Boolean);
      ta.value = existingWords.join(', ');
      ta.dataset.original = ta.value;
      ta.addEventListener('input', () => { saveDrafts(); });

      card.appendChild(ta);

      // Words hint (below first box)
      const wordsHint = document.createElement('div');
      wordsHint.className = 'field-hint';
      wordsHint.textContent = 'Enter words separated by commas (Traditional Chinese only).\ne.g. 蘋果, 香蕉, 學校, 米飯';
      card.appendChild(wordsHint);

      // Page context (single-use — not persisted)
      const ctxLabel = document.createElement('div');
      ctxLabel.style.cssText = 'font-size:0.8rem;font-weight:600;margin:8px 0 4px;color:rgba(30,58,95,0.7);';
      ctxLabel.textContent = '📝 Context for AI when generating new context sentence for newly added words.  This context is single use only and is not saved.';
      card.appendChild(ctxLabel);

      const ctxTa = document.createElement('textarea');
      ctxTa.rows = 2;
      ctxTa.className = 'page-context-ta';
      ctxTa.dataset.pageId = pid;
      ctxTa.placeholder = '食物和飲料相關的詞彙';
      ctxTa.style.cssText = 'min-height:50px;font-size:0.85rem;';
      ctxTa.addEventListener('input', () => { saveDrafts(); });
      card.appendChild(ctxTa);

      // Context hint (below second box)
      const ctxHint = document.createElement('div');
      ctxHint.className = 'field-hint';
      ctxHint.textContent = 'Optional Context for AI:  enter a short topic description (single-use, not saved, leave blank also works).';
      card.appendChild(ctxHint);

      container.appendChild(card);
    });

    document.getElementById('actionRow').style.display = ids.length ? 'flex' : 'none';
    setTimeout(restoreDrafts, 50);
  }

  // --- Add page ---
  function addNewPageCard(title = '', text = '') {
    const container = document.getElementById('pagesEditContainer');

    const card = document.createElement('div');
    card.className = 'page-card';
    card.dataset.new = 'true';
    card.style.border = '2px dashed #5A9AD6';

    const h4 = document.createElement('h4');
    const ti = document.createElement('input');
    ti.type = 'text';
    ti.className = 'page-title-input';
    ti.placeholder = 'Page name (e.g. Exam Prep)';
    ti.maxLength = 50;
    ti.value = title;
    ti.style.cssText = 'font-family:inherit;font-size:0.9rem;padding:4px 8px;border:1px solid rgba(30,58,95,0.15);border-radius:4px;width:100%;max-width:280px;';

    const rmBtn = document.createElement('button');
    rmBtn.textContent = '✕ Remove';
    rmBtn.style.cssText = 'font-size:0.75rem;padding:2px 8px;border:1px solid #DB5858;border-radius:999px;background:transparent;color:#DB5858;cursor:pointer;';
    rmBtn.addEventListener('click', () => { card.remove(); saveDrafts(); });

    h4.appendChild(ti);
    h4.appendChild(rmBtn);
    card.appendChild(h4);

    const ta = document.createElement('textarea');
    ta.rows = 3;
    ta.value = text;
    ta.placeholder = '蘋果, 香蕉, 學校, 米飯\n（只接受繁體中文，逗號分隔）';
    ta.addEventListener('input', saveDrafts);
    card.appendChild(ta);

    // Words hint (below first box)
    const wordsHint = document.createElement('div');
    wordsHint.className = 'field-hint';
    wordsHint.textContent = 'Enter words separated by commas (Traditional Chinese only).\ne.g. 蘋果, 香蕉, 學校, 米飯';
    card.appendChild(wordsHint);

    // Page context (single-use — not persisted)
    const ctxLabel = document.createElement('div');
    ctxLabel.style.cssText = 'font-size:0.8rem;font-weight:600;margin:8px 0 4px;color:rgba(30,58,95,0.7);';
    ctxLabel.textContent = '📝 Context for AI when generating new context sentence for newly added words.  This context is single use only and is not saved.';
    card.appendChild(ctxLabel);

    const ctxTa = document.createElement('textarea');
    ctxTa.rows = 2;
    ctxTa.className = 'page-context-ta';
    ctxTa.placeholder = '食物和飲料相關的詞彙';
    ctxTa.style.cssText = 'min-height:50px;font-size:0.85rem;';
    ctxTa.addEventListener('input', saveDrafts);
    card.appendChild(ctxTa);

    // Context hint (below second box)
    const ctxHint = document.createElement('div');
    ctxHint.className = 'field-hint';
    ctxHint.textContent = 'Optional Context for AI:  enter a short topic description (single-use, not saved, leave blank also works).';
    card.appendChild(ctxHint);

    container.appendChild(card);
    document.getElementById('actionRow').style.display = 'flex';
    card.scrollIntoView({ behavior: 'smooth' });
    if (!title) ti.focus();
    saveDrafts();
  }

  document.getElementById('addPageBtn').addEventListener('click', () => addNewPageCard());

  // --- Process diff ---
  function computeDiff() {
    const diffs = [];
    Object.keys(notebookPages).forEach(pid => {
      const page = notebookPages[pid] || {};
      const currentWords = getWordsForPage(pid);
      const ta = document.querySelector('.page-card[data-page-id="'+pid+'"] textarea');
      if (!ta) return;
      const desired = parseWords(ta.value);
      const added = desired.filter(v => !currentWords.includes(v));
      const removed = currentWords.filter(v => !desired.includes(v));
      // Read page context (single-use, not compared/loaded from Firestore)
      const ctxTa = document.querySelector('.page-context-ta[data-page-id="'+pid+'"]');
      const pageContext = ctxTa ? ctxTa.value.trim() : '';
      if (added.length || removed.length) {
        diffs.push({ pageId: pid, title: page.title || ('Page '+pid), added, removed, contexts: desired, context: pageContext, isNew: false, isDelete: false });
      }
    });
    document.querySelectorAll('input[type="checkbox"][data-delete-page]:checked').forEach(cb => {
      const pid = cb.dataset.deletePage;
      const page = notebookPages[pid] || {};
      diffs.push({ pageId: pid, title: page.title || ('Page '+pid), added: [], removed: getWordsForPage(pid), contexts: [], isNew: false, isDelete: true });
    });
    document.querySelectorAll('.page-card[data-new="true"]').forEach(card => {
      const ti = card.querySelector('input.page-title-input');
      const ta = card.querySelector('textarea');
      const ctxTa = card.querySelector('.page-context-ta');
      const title = ti ? ti.value.trim() : '';
      const desired = ta ? parseWords(ta.value) : [];
      const pageContext = ctxTa ? ctxTa.value.trim() : '';
      if (title) {
        diffs.push({ pageId: null, title, added: desired, removed: [], contexts: desired, context: pageContext, isNew: true, isDelete: false });
      }
    });
    return diffs;
  }

  function showSummary(diffs) {
    const content = document.getElementById('summaryContent');
    content.innerHTML = '';
    if (!diffs.length) { content.innerHTML = '<p>No changes detected.</p>'; }
    diffs.forEach(d => {
      const div = document.createElement('div');
      div.className = 'summary-item';
      if (d.isDelete) { div.classList.add('delete-page'); div.textContent = '🗑 DELETE Page "'+d.title+'" ('+d.removed.length+' words removed)'; }
      else if (d.isNew) { div.classList.add('new-page'); div.textContent = '➕ NEW Page "'+d.title+'": ' + (d.added.length ? d.added.join(', ') : '(empty)'); }
      else {
        const parts = [];
        if (d.added.length) parts.push('➕ Add: '+d.added.join(', '));
        if (d.removed.length) parts.push('➖ Remove: '+d.removed.join(', '));
        div.textContent = '📄 Page "'+d.title+'": ' + parts.join(' | ');
        if (d.added.length) div.classList.add('add');
        if (d.removed.length) div.classList.add('remove');
      }
      content.appendChild(div);
    });
    document.getElementById('summaryOverlay').classList.add('active');
    document.getElementById('confirmFromSummary').style.display = diffs.length ? '' : 'none';
  }

  document.getElementById('processBtn').addEventListener('click', () => {
    const diffs = computeDiff();
    showSummary(diffs);
  });
  document.getElementById('cancelSummary').addEventListener('click', () => {
    document.getElementById('summaryOverlay').classList.remove('active');
  });

  // --- Execute ---
  async function executeChanges(diffs) {
    if (!diffs.length) return;
    const docRef = db.collection('students').doc(student);
    const doc = await docRef.get();
    const data = doc.exists ? doc.data() : {};
    const notebook = data.notebook || {};
    const pages = data.notebookPages || {};
    if (!pages['01']) pages['01'] = { title: 'Main page' };

    // Track dispatch info: { pageId: { words: [], context: "" } }
    const dispatches = {};

    for (const d of diffs) {
      if (d.isDelete) {
        delete pages[d.pageId];
        for (const wid of Object.keys(notebook)) {
          if (notebook[wid].pageId === d.pageId) delete notebook[wid];
        }
      } else if (d.isNew) {
        const newId = nextPageId();
        pages[newId] = { title: d.title, _context: d.context || '' };
        if (d.added.length) dispatches[newId] = { words: d.added, context: d.context || '' };
        for (const word of d.added) {
          const wid = notebookWordId(student, newId, word);
          notebook[wid] = {
            traditional: word, simplified: '', english: '', pinyin: '',
            contextSentence: '', contextSentenceSimplified: '',
            audio: {}, pageId: newId, source: 'notebook',
            status: 'pending', failCount: 0,
            savedAt: firebase.firestore.FieldValue.serverTimestamp(),
          };
        }
      } else {
        // Page context is single-use — only sent via dispatch, not saved to Firestore
        pages[d.pageId] = pages[d.pageId] || {};
        if (d.added.length) dispatches[d.pageId] = { words: d.added, context: d.context || '' };
        for (const word of d.removed) {
          const wid = notebookWordId(student, d.pageId, word);
          delete notebook[wid];
        }
        for (const word of d.added) {
          const wid = notebookWordId(student, d.pageId, word);
          const existing = notebook[wid] || {};
          notebook[wid] = {
            traditional: word, simplified: existing.simplified || '', english: existing.english || '',
            pinyin: existing.pinyin || '', contextSentence: existing.contextSentence || '',
            contextSentenceSimplified: existing.contextSentenceSimplified || '',
            audio: existing.audio || {}, pageId: d.pageId,
            source: existing.source || 'notebook', status: 'pending',
            failCount: existing.failCount || 0,
            savedAt: firebase.firestore.FieldValue.serverTimestamp(),
          };
        }
      }
    }

    data.notebook = notebook;
    data.notebookPages = pages;
    data.lastUpdated = firebase.firestore.FieldValue.serverTimestamp();
    await docRef.set(data);

    // Create dispatch docs for each page with new words (non-blocking)
    for (const [pid, info] of Object.entries(dispatches)) {
      dispatchNotebookPage(student, pid, info.words, info.context);
    }

    notebookData = notebook;
    notebookPages = pages;
    sessionStorage.removeItem(storageKey);
  }

  async function doConfirm() {
    const diffs = computeDiff();
    if (!diffs.length) { showToast('No changes to process', 'error'); return; }
    try {
      await executeChanges(diffs);
      document.getElementById('summaryOverlay').classList.remove('active');
      const pendingCount = diffs.reduce((sum, d) => sum + d.added.length, 0);
      const removedCount = diffs.reduce((sum, d) => sum + d.removed.length, 0);
      const deletePages = diffs.filter(d => d.isDelete).length;
      const newPages = diffs.filter(d => d.isNew).length;

      const parts = [];
      if (pendingCount) parts.push(pendingCount + ' word(s) added');
      if (removedCount) parts.push(removedCount + ' word(s) removed');
      if (deletePages) parts.push(deletePages + ' page(s) deleted');
      if (newPages) parts.push(newPages + ' page(s) created');

      let msg = parts.join(', ');
      if (pendingCount) {
        msg += '! Enrichment queued — results in ~5-10 min.';
      } else {
        msg += '. No new words, no enrichment needed.';
      }
      showToast(msg, 'success');
      renderEditCards();
      renderPagesList();
    } catch(err) {
      console.error(err);
      showToast('Failed to save. Please try again.', 'error');
    }
  }

  document.getElementById('confirmBtn').addEventListener('click', doConfirm);
  document.getElementById('confirmFromSummary').addEventListener('click', doConfirm);

  // --- Refresh status (systematic diagnostic) ---
  async function refreshStatus() {
    try {
      notebookData = await loadNotebook(student);
      notebookPages = await loadNotebookPages(student);
      renderEditCards();
      renderPagesList();

      const wordStatus = {};
      const pendingNames = [], errorNames = [], generatedNames = [];
      Object.values(notebookData).forEach(e => {
        const s = e.status || 'pending';
        if (s === 'pending') pendingNames.push(e.traditional);
        else if (s === 'error') errorNames.push(e.traditional);
        else if (s === 'generated') generatedNames.push(e.traditional);
      });

      let dispatchCounts = {}, latestDispatch = null;
      try {
        const snap = await db.collection('notebookDispatches')
          .where('student', '==', student).orderBy('createdAt', 'desc').limit(10).get();
        snap.forEach(doc => { const d = doc.data(); dispatchCounts[d.status] = (dispatchCounts[d.status]||0)+1; });
        if (!snap.empty) { const first = snap.docs[0].data(); latestDispatch = first.createdAt ? first.createdAt.toDate() : null; }
      } catch(e) {}

      // Timing
      const now = new Date();
      let ageStr = '';
      if (latestDispatch) {
        const secs = Math.round((now - latestDispatch) / 1000);
        if (secs < 60) ageStr = `${secs}s ago`;
        else if (secs < 3600) ageStr = `${Math.round(secs/60)}m ago`;
        else ageStr = `${Math.round(secs/3600)}h ago`;
      }

      const lines = [];

      // --- Section 1: Technical Status ---
      lines.push('── Status ──');

      // 1a. Firestore
      const saved = Object.keys(notebookData).length;
      lines.push(`Firestore Save: ${saved} word(s) stored`);
      if (generatedNames.length) lines.push(`  Ready: ${generatedNames.slice(0,5).join(', ')}${generatedNames.length>5?' +'+(generatedNames.length-5)+' more':''}`);
      if (pendingNames.length) lines.push(`  Pending: ${pendingNames.slice(0,5).join(', ')}${pendingNames.length>5?' +'+(pendingNames.length-5)+' more':''}`);
      if (errorNames.length) lines.push(`  Failed: ${errorNames.slice(0,3).join(', ')}`);

      // 1b. Dispatch Job
      const anyDispatch = Object.keys(dispatchCounts).length > 0;
      if (anyDispatch) {
        const parts = [];
        if (dispatchCounts.pending) parts.push(`${dispatchCounts.pending} waiting`);
        if (dispatchCounts.dispatching) parts.push(`${dispatchCounts.dispatching} in progress`);
        if (dispatchCounts.dispatched) parts.push(`${dispatchCounts.dispatched} sent`);
        if (dispatchCounts.dispatch_failed) parts.push(`${dispatchCounts.dispatch_failed} failed`);
        lines.push(`Dispatch Job: ${parts.join(', ')}${ageStr ? ' (latest '+ageStr+')' : ''}`);
      } else {
        lines.push('Dispatch Job: ❓ No job found');
      }

      // 1c. Cloud Function
      if (dispatchCounts.dispatched > 0 || dispatchCounts.dispatching > 0) {
        lines.push('Cloud Function: ✅ Triggered');
      } else if (dispatchCounts.dispatch_failed > 0) {
        lines.push('Cloud Function: ❌ Error (see CF logs)');
      } else if (dispatchCounts.pending > 0) {
        lines.push('Cloud Function: ⏳ Waiting to trigger');
      } else {
        lines.push('Cloud Function: ❓ Unknown (no dispatch)');
      }

      // 1d. Pipeline Enrichment
      if (generatedNames.length > 0) {
        lines.push('Pipeline Enrichment: ✅ Completed');
      } else if (dispatchCounts.dispatched > 0 && pendingNames.length > 0) {
        lines.push('Pipeline Enrichment: ⏳ Running or stalled');
      } else if (pendingNames.length > 0) {
        lines.push('Pipeline Enrichment: ⏳ Not yet started');
      } else {
        lines.push('Pipeline Enrichment: N/A (no pending words)');
      }

      // --- Section 2: Errors ---
      lines.push('');
      lines.push('── Errors ──');

      if (errorNames.length > 0) {
        lines.push(`${errorNames.length} word(s) failed AI enrichment: ${errorNames.join(', ')}`);
        lines.push(`Contact your teacher if this persists.`);
      } else if (dispatchCounts.dispatch_failed > 0) {
        lines.push(`Contact your teacher — the dispatch failed.`);
      } else if (!anyDispatch && pendingNames.length > 0) {
        lines.push(`No dispatch job was created. Words are saved but nothing will happen.`);
        lines.push(`Possible cause: Firestore permission missing for notebookDispatches/ collection.`);
      } else if (dispatchCounts.dispatched > 0 && pendingNames.length > 0) {
        lines.push(`Dispatch was sent but words are still pending.`);
        lines.push(`Possible cause: AI pipeline may have run but not written results. Contact your teacher if this persists.`);
      } else {
        lines.push('None');
      }

      // --- Section 3: Next Steps ---
      lines.push('');
      lines.push('── Next Steps ──');

      const secsSince = latestDispatch ? Math.round((now - latestDispatch) / 1000) : null;

      if (generatedNames.length > 0 && pendingNames.length === 0 && errorNames.length === 0) {
        lines.push('All words are ready. Return to Dashboard to study.');
      } else if (pendingNames.length > 0 && !anyDispatch) {
        lines.push('Click "Confirm & Enrich" to submit words for processing.');
      } else if (dispatchCounts.pending > 0) {
        lines.push('Waiting for the Cloud Function to pick up the job. Check again in 1-2 min.');
      } else if (dispatchCounts.dispatched > 0 && pendingNames.length > 0) {
        if (secsSince && secsSince < 120) {
          lines.push(`Job was sent ${ageStr}. Pipeline typically takes 5-10 min. Check again soon.`);
        } else if (secsSince && secsSince < 600) {
          lines.push(`Job was sent ${ageStr}. Pipeline may still be running. Wait a few more minutes.`);
        } else {
          lines.push(`Job was sent ${ageStr} — this is longer than expected. Contact your teacher.`);
        }
      } else if (dispatchCounts.dispatch_failed > 0) {
        lines.push('Contact your teacher — the dispatch failed.');
      } else if (errorNames.length > 0) {
        lines.push('Delete failed words from the textarea and re-add them. Click Confirm & Enrich to retry.');
      } else {
        lines.push('Return to Dashboard to continue.');
      }

      const msg = lines.join('\n');
      const isError = errorNames.length > 0 || dispatchCounts.dispatch_failed > 0;
      showToast(msg, isError ? 'error' : 'success');
    } catch(e) { showToast('Could not check status. Please try again.', 'error'); }
  }
  document.getElementById('refreshStatusBtn').addEventListener('click', refreshStatus);

  // --- Init ---
  async function init() {
    await populateStudentDropdown();
    try {
      notebookData = await loadNotebook(student);
      notebookPages = await loadNotebookPages(student);
    } catch(e) { console.error(e); }
    renderPagesList();
    renderEditCards();
  }
  init();
})();
</script>
